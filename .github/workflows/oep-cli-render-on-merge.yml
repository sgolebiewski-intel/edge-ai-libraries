name: "[OEP CLI]  Render OEP CLI on merge"
run-name: "[OEP CLI]  Render OEP CLI on merge workflow (by @${{ github.actor }} via ${{ github.event_name }})"

# Regenerate the committed, ready-to-ship installer
# (frameworks/oep-installer-cli/rendered/openedge-cli) whenever any of its
# source inputs change on a tracked branch (i.e. after a PR merges). The
# regenerated artifact is proposed back to the same branch via an
# auto-merging pull request (the branch ruleset forbids direct pushes), so the
# rendered installer never drifts from source.
on:
  push:
    branches:
      - main
      - 'release-*'
      - 'release/**'
    paths:
      - 'frameworks/oep-installer-cli/openedge-cli'
      - 'frameworks/oep-installer-cli/common/**'
      - 'frameworks/oep-installer-cli/license/**'
      - 'frameworks/oep-installer-cli/module/**'
      - 'frameworks/oep-installer-cli/profile/**'
      - '.github/workflows/oep-cli-render-on-merge.yml'
      # NOTE: rendered/** is intentionally NOT listed. The bot pushes its own
      # regenerated file under rendered/, and excluding it here prevents the
      # workflow from re-triggering itself in an infinite loop.

# Serialize renders per branch so concurrent merges cannot race on the push.
concurrency:
  group: oep-cli-render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    name: Regenerate rendered/openedge-cli
    # Loop guard: never act on the bot's own render commit.
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'copilot-swe-agent[bot]' &&
      github.actor != 'Copilot' &&
      github.actor != vars.AUTOMATION_ACTOR
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify required tooling
        run: |
          set -euo pipefail
          for tool in bash git sed gh; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Missing required tool: ${tool}. Install it on the self-hosted runner and retry."
              exit 1
            fi
          done

      - name: Clean workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          clean: true
          token: ${{ github.token }}

      - name: Regenerate installer
        working-directory: frameworks/oep-installer-cli
        run: |
          set -euo pipefail
          ./openedge-cli bootstrap

      - name: Open (or update) an auto-merging PR if the rendered installer changed
        working-directory: frameworks/oep-installer-cli
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- rendered/openedge-cli; then
            echo "::notice::rendered/openedge-cli already up to date — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Deterministic, per-target-branch bot branch so repeated renders reuse
          # the same PR instead of spawning duplicates.
          PR_BRANCH="automation/oep-cli-render/${BRANCH}"

          # -f is required: rendered/.gitignore contains "*", which would otherwise
          # block staging the (already tracked) rendered artifact.
          git add -f rendered/openedge-cli
          git commit -m "chore(oep-cli): regenerate rendered/openedge-cli"

          # Force-update the bot branch to exactly this commit on top of the
          # target branch; -f keeps the branch idempotent across reruns.
          git push -f origin "HEAD:${PR_BRANCH}"

          # Reuse an existing open PR for this branch, otherwise create one.
          if [ -z "$(gh pr list --head "$PR_BRANCH" --base "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head "$PR_BRANCH" \
              --base "$BRANCH" \
              --title "chore(oep-cli): regenerate rendered/openedge-cli" \
              --body "Automated regeneration of \`rendered/openedge-cli\` to keep it in sync with its source modules/profiles. Generated by the OEP CLI render-on-merge workflow."
          else
            echo "::notice::Reusing existing open PR for ${PR_BRANCH}."
          fi

          # Enable auto-merge so the PR lands once required checks pass. Do not
          # fail the run if auto-merge is not permitted — leave the PR open for
          # manual merge instead.
          if ! gh pr merge "$PR_BRANCH" --auto --squash; then
            echo "::warning::Could not enable auto-merge for ${PR_BRANCH}; leaving the PR open for manual merge."
          fi

          echo "::notice::Opened/updated auto-merging PR for rendered/openedge-cli against ${BRANCH}."
